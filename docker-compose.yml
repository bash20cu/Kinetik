services:
  postgres:
    image: postgres:16-alpine
    container_name: kinetik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinetik
      POSTGRES_USER: kinetik
      POSTGRES_PASSWORD: kinetik
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetik -d kinetik"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
